[package]
name = "numerobis"
version = "0.5.6"
authors = ["Zinedin Polic"]
edition = "2024"
rust-version = "1.100.0"
description = "Raw accelerator computing (GPU matrix engines, NPUs) on top of miraculix formats"
license = "MIT OR Apache-2.0"
categories = ["hardware-support"]
repository = "https://github.com/zinedinp/numerobis"

[features]
default = []
# Raw backends (kernel UAPI only, libc). Declared now so the module layout
# is fixed
intel = []
amd = []
nvidia = []
tt = []
xdna = []
v3d = []
accel = []
# Comfort backends. `vulkan` and `directx` are the graphics API tables
# (capabilities, routes, probes); each builds without the other, and with
# both `directx::vulkan` converts between them. Both describe colour
# (swapchain colour spaces, HDR metadata) with keinbonus.
vulkan = ["dep:keinbonus"]
directx = ["dep:keinbonus"]
cuda = []
hip = []
# Test-only backend: runs the Emulated semantics in Rust on the host.
mock = []

[dependencies]
miraculix = { version = "^0.7.1", default-features = false }
keinbonus = { version = "0.1.0", optional = true }

# The raw backends and dma-bufs are Linux kernel UAPI.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# Turns the mock backend on for integration tests and doctests.
numerobis = { path = ".", features = ["mock", "vulkan", "directx"] }

[[example]]
name = "vulkan_probe"
required-features = ["vulkan"]

[[example]]
name = "directx_probe"
required-features = ["directx"]

[[example]]
name = "hdr_probe"
required-features = ["vulkan"]

[[example]]
name = "matrix_probe"
required-features = ["vulkan"]

[[example]]
name = "xess_probe"
required-features = ["directx"]

# The project's standard: clippy::pedantic, with the exceptions reasoned
# where they are (`#[allow(..., reason = "...")]`).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
